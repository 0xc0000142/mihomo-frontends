<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>mihomo</title>
<style>
:root {
  --bg: #121212; --card: #1e1e1e; --line: #2c2c2c;
  --fg: #e6e6e6; --dim: #9a9a9a; --acc: #7c9eff;
  --ok: #4caf7d; --warn: #d8a13c; --err: #e05c5c;
}
@media (prefers-color-scheme: light) {
  :root { --bg:#f5f5f7; --card:#ffffff; --line:#e0e0e0; --fg:#1c1c1e; --dim:#6b6b70; --acc:#3457d5; }
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, "Segoe UI", "Noto Sans SC", sans-serif; }
#app { max-width: 860px; margin: 0 auto; padding: 0 14px 96px; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 0 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
header.top h1 { font-size: 18px; font-weight: 600; }
.pill { font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
.pill.on { color: var(--ok); border-color: var(--ok); }
.pill.off { color: var(--err); border-color: var(--err); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-top: 14px; }
.card h2 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row + .row { margin-top: 10px; }
.grow { flex: 1; min-width: 0; }
.dim { color: var(--dim); font-size: 13px; }
button, .btn { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
button.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
button.danger { color: var(--err); border-color: var(--err); }
button:disabled { opacity: .45; cursor: default; }
input[type=text], input[type=password], input[type=number], select, textarea {
  width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: inherit;
}
textarea.mono, pre.mono { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
textarea.mono { min-height: 55vh; white-space: pre; }
pre.mono { overflow: auto; max-height: 60vh; padding: 10px; background: var(--bg); border-radius: 8px; border: 1px solid var(--line); }
label.field { display: block; margin-top: 10px; font-size: 13px; color: var(--dim); }
label.field input, label.field select { margin-top: 4px; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; background: var(--card); border-top: 1px solid var(--line); overflow-x: auto; }
nav.tabs a { flex: 1; min-width: 64px; text-align: center; padding: 10px 4px calc(10px + env(safe-area-inset-bottom)); font-size: 12px; color: var(--dim); text-decoration: none; white-space: nowrap; }
nav.tabs a.active { color: var(--acc); font-weight: 600; }
table.list { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.list th, table.list td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.list th { color: var(--dim); font-weight: 500; }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; font-size: 14px; max-width: 90%; z-index: 20; box-shadow: 0 4px 18px rgba(0,0,0,.4); }
.toast.err { border-color: var(--err); color: var(--err); }
.toast.ok { border-color: var(--ok); color: var(--ok); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; user-select: none; }
.chip.sel { background: var(--acc); border-color: var(--acc); color: #fff; }
.sub-item { display: flex; gap: 8px; align-items: center; }
.sub-item + .sub-item { margin-top: 8px; }
.sub-item input[name=sname] { max-width: 130px; }
.sub-item input[name=sua] { max-width: 150px; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--acc); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; }
@keyframes sp { to { transform: rotate(360deg); } }
details.fold summary { cursor: pointer; color: var(--dim); font-size: 13px; }
a { color: var(--acc); }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>mihomo</h1>
    <span id="svc-pill" class="pill">…</span>
    <span id="ver-pill" class="pill grow"></span>
    <button id="btn-refresh" title="刷新">⟳</button>
  </header>
  <main id="view"><p class="dim" style="margin-top:20px"><span class="spin"></span> 加载中…</p></main>
</div>
<nav class="tabs" id="tabs"></nav>
<script src="js/app.js"></script>
</body>
</html>
