# ============================================================
# mihomo 内置模板（适配 liuran001/mihomo：eBPF 入站 + Smart 策略组）
# 结构来自实际使用中的手机/PC 配置：多机场订阅 → 地区 Smart 组 → 分应用策略组 → geosite 分流。
# 由 LuCI「向导」与 Magisk 模块向导渲染：以 #@ 开头的行会换成订阅、面板密钥、镜像地址与下联接口，其余原样写入。
# 渲染结果是普通的 mihomo 配置，之后可以在「订阅」「策略组」「配置文件」等页面继续修改。
#   - 透明代理：eBPF hybrid，本机流量走 cgroup，下联走 packet_rewrite；国内 IP 在内核直连
#   - DNS：redir-host，53 端口由 DNS_Hijack 出站接管，国内域名用国内上游，海外走「dns」组
#   - 规则集与面板走 GitHub 镜像（向导里的「镜像前缀」，为空时直连 GitHub）
#   - 不含任何订阅地址或密钥
# 参考文档：https://wiki.metacubex.one/config
# ============================================================

# 锚点：订阅（proxy-providers）公共设置
p: &p
  type: http
  interval: 3600 # 订阅更新间隔（秒）
  health-check:
    enable: true
    url: https://cp.cloudflare.com
    interval: 300 # 健康检查间隔（秒）
    timeout: 1000 # 超时（毫秒）
# 锚点：select 策略组的公共出站列表
pr: &pr
  type: select
  proxies: [节点选择, 香港, 台湾, 日本, 新加坡, 美国, 英国, 德国, 其它地区, 全部节点, 自动选择, DIRECT]
# 锚点：Smart 智能择优组（各地区组与「全部节点」共用下列订阅）
# 策略组的测速参数是组内同级字段，嵌套的 health-check 不会被读取
use: &use
  type: smart
  use:
    #@use
  prefer-udp: true
  prefer-ipv6: true
  url: https://cp.cloudflare.com
  interval: 300
  timeout: 1500
  lazy: true

# 订阅
proxy-providers:
  #@providers

mixed-port: 7890
mode: rule
ipv6: true
allow-lan: true
bind-address: '*'
unified-delay: false
tcp-concurrent: true
log-level: warning
# 路由器上下联流量没有本地进程可查，关掉以省 CPU
find-process-mode: off

# 外部控制（LuCI 与 zashboard 面板都通过它管理内核）
external-controller: 0.0.0.0:9090
#@secret
external-ui: ./dashboard
#@ui-url

# Smart 内核可选项（需要时取消注释）：
#   profile.smart-collector-size: 100   # 择优数据收集文件上限（MB）
#   lgbm-auto-update: true              # LightGBM 模型自动更新（需能访问外网）
#   lgbm-update-interval: 72
#   lgbm-url: "https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model.bin"
profile:
  store-selected: true
  store-fake-ip: true

# Geo 数据库（jsDelivr 镜像，路由器直连也能下载）
geo-auto-update: false
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

# 流量嗅探
sniffer:
  enable: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# Tun（路由器上由 eBPF 接管，保持关闭）
tun:
  enable: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: redir-host
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fc00::/18
  fake-ip-filter:
    - "rule-set:Fake-IP-Filter"
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    rule-set:AWAvenue-Ads: rcode://success
    "geosite:cn,private":
      - 223.5.5.5
      - 119.29.29.29
  nameserver:
    - https://8.8.8.8/dns-query#节点选择
    - https://1.1.1.1/dns-query#节点选择

proxies:
  # 接管 53 端口的 DNS 请求，交给上面的 dns 模块解析
  - {name: DNS_Hijack, type: dns}

proxy-groups:
  - name: 节点选择
    type: select
    proxies: [全部节点, 自动选择, 香港, 台湾, 日本, 新加坡, 美国, 英国, 德国, 其它地区, DIRECT]
    icon: https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Proxy.png
  # 海外域名解析所走的节点，一般跟随节点选择
  - {name: dns, <<: *pr, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Server.png"}
  - {name: 广告拦截, type: select, proxies: [REJECT, DIRECT, 节点选择], icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Advertising.png"}
  - {name: 学术, <<: *pr, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Scholar.png"}
  - {name: 境外AI, <<: *pr, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/AI.png"}
  - {name: Apple, <<: *pr, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Apple.png"}
  - {name: Google, <<: *pr, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Google.png"}
  - {name: Telegram, <<: *pr, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Telegram.png"}
  - {name: Twitter, <<: *pr, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Twitter.png"}
  - {name: Pixiv, <<: *pr, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Pixiv.png"}
  - {name: ehentai, <<: *pr, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/ehentai.png"}
  - {name: 巴哈姆特, <<: *pr, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Bahamut.png"}
  - {name: YouTube, <<: *pr, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/YouTube.png"}
  - {name: NETFLIX, <<: *pr, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Netflix.png"}
  - {name: TikTok, <<: *pr, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/TikTok.png"}
  - {name: Spotify, <<: *pr, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Spotify.png"}
  - {name: Github, <<: *pr, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/GitHub.png"}
  - {name: Steam, <<: *pr, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Steam.png"}
  - {name: OneDrive, <<: *pr, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/OneDrive.png"}
  - {name: 微软服务, <<: *pr, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Microsoft.png"}
  - name: 国内
    type: select
    proxies: [DIRECT, 节点选择, 香港, 台湾, 日本, 新加坡, 美国, 英国, 德国, 其它地区, 全部节点, 自动选择]
    icon: https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/China.png
  # 所有规则都没匹配到的流量（漏网之鱼）
  - {name: 其他, <<: *pr, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/ForeignMedia.png"}
  # 以下是地区分组（Smart 智能择优）；exclude-filter 去掉订阅里的流量、到期等说明节点
  - {name: 香港, <<: *use, filter: "(?i)(香港|🇭🇰|(^|[^A-Za-z0-9])(Hong[ _-]?Kong|HKG|HK)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$))", exclude-filter: &info "(?i)(流量|剩余|到期|过期|重置|套餐|官网|网站|频道|订阅|更新|客户端|请收藏|Traffic|Expire|Reset|Remaining|Bandwidth|Quota|TG[ _-]?bot)", icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Hong_Kong.png"}
  - {name: 台湾, <<: *use, filter: "(?i)(台湾|臺灣|台灣|台北|臺北|🇹🇼|(^|[^A-Za-z0-9])(Taiwan|Taipei|TWN|TPE|TW)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$))", exclude-filter: *info, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Taiwan.png"}
  - {name: 日本, <<: *use, filter: "(?i)(日本|东京|東京|大阪|🇯🇵|(^|[^A-Za-z0-9])(Japan|Tokyo|Osaka|JPN|NRT|HND|KIX|JP)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$))", exclude-filter: *info, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Japan.png"}
  - {name: 新加坡, <<: *use, filter: "(?i)(新加坡|狮城|🇸🇬|(^|[^A-Za-z0-9])(Singapore|SGP|SIN|SG)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$))", exclude-filter: *info, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Singapore.png"}
  - {name: 美国, <<: *use, filter: "(?i)(美国|美國|🇺🇸|🇺🇲|(^|[^A-Za-z0-9])(United[ _-]?States|America|USA|US)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$))", exclude-filter: *info, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/United_States.png"}
  - {name: 英国, <<: *use, filter: "(?i)(英国|英國|🇬🇧|(^|[^A-Za-z0-9])(United[ _-]?Kingdom|Great[ _-]?Britain|Britain|England|GBR|UK)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$))", exclude-filter: *info, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/United_Kingdom.png"}
  - {name: 德国, <<: *use, filter: "(?i)(德国|德國|🇩🇪|(^|[^A-Za-z0-9])(Germany|Deutschland|DEU|DE)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$))", exclude-filter: *info, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Germany.png"}
  - {name: 其它地区, <<: *use, filter: ".*", exclude-filter: "(?i)(流量|剩余|到期|过期|重置|套餐|官网|网站|频道|订阅|更新|客户端|请收藏|Traffic|Expire|Reset|Remaining|Bandwidth|Quota|TG[ _-]?bot|香港|🇭🇰|(^|[^A-Za-z0-9])(Hong[ _-]?Kong|HKG|HK)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$)|台湾|臺灣|台灣|台北|臺北|🇹🇼|(^|[^A-Za-z0-9])(Taiwan|Taipei|TWN|TPE|TW)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$)|日本|东京|東京|大阪|🇯🇵|(^|[^A-Za-z0-9])(Japan|Tokyo|Osaka|JPN|NRT|HND|KIX|JP)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$)|美国|美國|🇺🇸|🇺🇲|(^|[^A-Za-z0-9])(United[ _-]?States|America|USA|US)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$)|新加坡|狮城|🇸🇬|(^|[^A-Za-z0-9])(Singapore|SGP|SIN|SG)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$)|英国|英國|🇬🇧|(^|[^A-Za-z0-9])(United[ _-]?Kingdom|Great[ _-]?Britain|Britain|England|GBR|UK)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$)|德国|德國|🇩🇪|(^|[^A-Za-z0-9])(Germany|Deutschland|DEU|DE)([ _-]?[A-Z]?[0-9]{1,3})?([^A-Za-z0-9]|$)|🇨🇳)", icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/World_Map.png"}
  - {name: 全部节点, <<: *use, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Proxy.png"}
  - {name: 自动选择, <<: *use, tolerance: 2, type: url-test, icon: "https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Auto.png"}

rule-providers:
  Fake-IP-Filter:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./rule_provider/Fake-IP-Filter.mrs
    #@fake-ip-filter-url
  AWAvenue-Ads:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./rule_provider/AWAvenue-Ads.mrs
    url: "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.mrs"
    proxy: 节点选择 # raw.githubusercontent.com 直连不稳定
  CN-IP:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    path: ./rule_provider/cn-ip.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"
    proxy: 节点选择

rules:
  # 下联设备的 DNS 请求交给 dns 模块
  - DST-PORT,53,DNS_Hijack
  - DST-PORT,22,DIRECT
  # 支付宝香港直连
  - DOMAIN-SUFFIX,alipayhk.com,DIRECT
  - DOMAIN-SUFFIX,alipay.hk,DIRECT
  # 海外手机卡（eSIM / 漫游）的运营商服务走对应地区，否则激活、WiFi Calling 会失败
  # 英国：mcc234、Vodafone / VOXI、EE / CMLink UK、giffgaff
  - DOMAIN-KEYWORD,mcc234,英国
  - DOMAIN-SUFFIX,entsrv-uk.vodafone.com,英国
  - DOMAIN-SUFFIX,vuk-gto.prod.ondemandconnectivity.com,英国
  - DOMAIN,vfgb.idemia.io,英国
  - DOMAIN-SUFFIX,ct.ee.co.uk,英国
  - IP-CIDR,88.82.0.0/19,英国,no-resolve
  - IP-CIDR,148.252.160.0/19,英国,no-resolve
  - IP-CIDR,46.68.0.0/17,英国,no-resolve
  - IP-CIDR,87.194.0.0/16,英国,no-resolve
  - IP-CIDR,31.94.0.0/16,英国,no-resolve
  # 德国：O2 DE、Vodafone DE
  - IP-CIDR,62.52.0.0/14,德国,no-resolve
  - IP-CIDR,213.20.0.0/16,德国,no-resolve
  - IP-CIDR,139.7.0.0/16,德国,no-resolve
  # 香港：mcc454、CSL / 和记 / SmarTone
  - DOMAIN-KEYWORD,mcc454,香港
  - DOMAIN,csl.prod.ondemandconnectivity.com,香港
  - DOMAIN,hhk.prod.ondemandconnectivity.com,香港
  - DOMAIN,snr.prod.ondemandconnectivity.com,香港
  - IP-CIDR,107.178.224.0/19,香港,no-resolve
  # 广告拦截
  - RULE-SET,AWAvenue-Ads,广告拦截
  # 应用分流
  - GEOSITE,category-scholar-!cn,学术
  - GEOSITE,category-ai-!cn,境外AI
  - GEOSITE,apple,Apple
  - GEOSITE,apple-cn,Apple
  - GEOSITE,ehentai,ehentai
  - GEOSITE,github,Github
  - GEOSITE,twitter,Twitter
  - GEOSITE,youtube,YouTube
  - GEOSITE,google,Google
  - GEOSITE,google-cn,Google
  - GEOSITE,telegram,Telegram
  - GEOSITE,netflix,NETFLIX
  - GEOSITE,tiktok,TikTok
  - GEOSITE,bahamut,巴哈姆特
  - GEOSITE,spotify,Spotify
  - GEOSITE,pixiv,Pixiv
  - GEOSITE,steam@cn,DIRECT
  - GEOSITE,steam,Steam
  - GEOSITE,onedrive,OneDrive
  - GEOSITE,microsoft,微软服务
  - GEOSITE,geolocation-!cn,其他
  - GEOIP,google,Google
  - GEOIP,netflix,NETFLIX
  - GEOIP,telegram,Telegram
  - GEOIP,twitter,Twitter
  - GEOSITE,CN,国内
  - GEOIP,CN,国内
  # 局域网地址直连
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT
  - MATCH,其他

# eBPF 透明入站：本机（cgroup）+ 下联网桥（packet_rewrite）
listeners:
  - name: ebpf-in
    type: ebpf
    mode: hybrid
    network: [tcp, udp]
    udp-timeout: 300
    bypass-rule-set: [CN-IP] # 国内 IP 在内核直连，不进核心
    local:
      data-plane: cgroup
      dns-mode: hijack
      ipv6: true
      bypass-private-address: true
    shared:
      #@lan
      data-plane: packet_rewrite
      dns-mode: hijack
      ipv6: true
      bypass-private-address: true
